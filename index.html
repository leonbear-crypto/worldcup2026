<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Protocol</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7931a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Protocol">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    background: #060606;
    color: #e8e8e8;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    padding: 24px 20px;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0d0d0d; }
  ::-webkit-scrollbar-thumb { background: #222; }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px #f7931a; }
    50% { opacity: 0.3; box-shadow: 0 0 2px #f7931a; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .pulse-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f7931a;
    box-shadow: 0 0 8px #f7931a;
    animation: pulse 2s infinite;
    margin-right: 8px;
  }
  .title-line {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
  }
  .title {
    font-size: 12px;
    color: #f7931a;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 10px;
    color: #333;
    letter-spacing: 0.1em;
  }
  .refresh-btn {
    background: none;
    border: 1px solid #222;
    color: #555;
    font-size: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;
    transition: border-color 0.2s, color 0.2s;
  }
  .refresh-btn:hover { border-color: #f7931a44; color: #f7931a; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    overflow: hidden;
  }
  .card {
    background: #0d0d0d;
    border: 1px solid #1a1a1a;
    border-radius: 2px;
    padding: 16px 20px;
    overflow: hidden;
    min-width: 0;
  }
  .card.accent { border-color: #f7931a44; }
  .card.full { grid-column: 1 / -1; }
  .card-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
    color: #e8e8e8;
    letter-spacing: -0.02em;
  }
  .card-value.orange { color: #f7931a; }
  .card-sub {
    font-size: 11px;
    color: #444;
    margin-top: 4px;
  }

  /* Block Timer */
  .timer-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .timer-value {
    font-size: 34px;
    font-weight: 700;
    color: #e8e8e8;
    transition: color 0.3s;
  }
  .timer-value.over { color: #ff6b6b; }
  .timer-avg { font-size: 12px; color: #444; }
  .progress-track {
    height: 3px;
    background: #1a1a1a;
    border-radius: 1px;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 100%;
    border-radius: 1px;
    background: #f7931a;
    box-shadow: 0 0 6px #f7931a;
    transition: width 1s linear, background 0.3s;
  }
  .progress-bar.over { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
  .timer-note { font-size: 10px; color: #333; }

  /* Mempool */
  .mempool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-top: 10px;
  }
  .mempool-label { font-size: 10px; color: #444; margin-bottom: 4px; }
  .mempool-value { font-size: 17px; color: #e8e8e8; font-weight: 600; }

  /* Halving */
  .halving-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .halving-value { font-size: 26px; font-weight: 700; color: #e8e8e8; }
  .halving-days { font-size: 13px; color: #555; }
  .halving-bar {
    height: 3px;
    background: linear-gradient(90deg, #f7931a44, #f7931a);
    border-radius: 1px;
  }
  .halving-sub { font-size: 10px; color: #333; margin-top: 6px; }

  /* Footer */
  .footer {
    grid-column: 1 / -1;
    border-top: 1px solid #111;
    padding-top: 12px;
    font-size: 9px;
    color: #2a2a2a;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
  }

  /* Loading */
  .loading {
    text-align: center;
    color: #333;
    font-size: 12px;
    margin-top: 80px;
  }
  .loading-bar {
    color: #f7931a;
    font-size: 14px;
    margin-top: 10px;
    animation: blink 1s infinite;
  }

  .error-box {
    background: #1a0000;
    border: 1px solid #ff444433;
    padding: 12px 16px;
    border-radius: 2px;
    margin-bottom: 16px;
    font-size: 12px;
    color: #ff6b6b;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title-line">
      <span class="pulse-dot"></span>
      <span class="title">Bitcoin Protocol</span>
    </div>
    <div class="subtitle" id="last-updated">연결 중...</div>
  </div>
  <button class="refresh-btn" onclick="fetchAll()">REFRESH</button>
</div>

<div id="loading" class="loading">
  체인 동기화 중...<br>
  <span class="loading-bar">▓▓▓░░░░░░░</span>
</div>

<div class="grid" id="grid" style="display:none;"></div>

<script>
const API = "https://mempool.space/api";
let blockTimerInterval = null;
let autoRefreshInterval = null;
let state = {};

async function fetchAll() {
  try {
    const [heightRes, mempoolRes, diffRes, feesRes] = await Promise.all([
      fetch(`${API}/blocks/tip/height`),
      fetch(`${API}/mempool`),
      fetch(`${API}/v1/difficulty-adjustment`),
      fetch(`${API}/v1/fees/recommended`),
    ]);

    const height = await heightRes.json();
    const mempool = await mempoolRes.json();
    const diff = await diffRes.json();
    const fees = await feesRes.json();

    const hashRes = await fetch(`${API}/blocks/tip/hash`);
    const hash = (await hashRes.text()).trim();
    const blockRes = await fetch(`${API}/block/${hash}`);
    const block = await blockRes.json();

    state = { height, mempool, diff, fees, lastBlockTime: block.timestamp };

    document.getElementById("loading").style.display = "none";
    document.getElementById("grid").style.display = "grid";

    const now = new Date();
    document.getElementById("last-updated").textContent =
      `업데이트 ${now.toLocaleTimeString("ko-KR")}`;

    render();
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("grid").style.display = "grid";
    renderError("mempool.space API 연결 실패 — " + e.message);
  }
}

function render() {
  const { height, mempool, diff, fees, lastBlockTime } = state;

  const hashrate = diff?.currentHashrate
    ? (diff.currentHashrate / 1e18).toFixed(2) + " EH/s"
    : "—";

  const diffChange = diff?.difficultyChange != null
    ? (diff.difficultyChange > 0 ? "+" : "") + diff.difficultyChange.toFixed(2) + "%"
    : "—";

  const nextDiffBlocks = diff?.remainingBlocks ?? "—";

  // Next halving
  const halvings = [210000, 420000, 630000, 840000, 1050000, 1260000];
  const nextHalving = halvings.find(h => h > height) ?? 1260000;
  const blocksLeft = nextHalving - height;
  const daysLeft = Math.floor(blocksLeft * 10 / 60 / 24);
  const halvingNum = halvings.indexOf(nextHalving) + 1;
  const epochProgress = Math.round(((nextHalving - 210000 - blocksLeft) / 210000) * 100);
  const currentReward = (3.125 / Math.pow(2, Math.max(0, halvingNum - 5))).toFixed(4);

  const mempoolCount = mempool?.count?.toLocaleString() ?? "—";
  const mempoolSize = mempool?.vsize ? (mempool.vsize / 1e6).toFixed(2) + " MB" : "—";
  const mempoolFee = mempool?.total_fee ? (mempool.total_fee / 1e8).toFixed(4) + " BTC" : "—";

  document.getElementById("grid").innerHTML = `
    <div class="card full" id="block-timer-card">
      <div class="card-label">마지막 블록 이후 경과 시간</div>
      <div class="timer-row">
        <div class="timer-value" id="timer-val">0m 00s</div>
        <div class="timer-avg">avg 10m 00s</div>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
      <div class="timer-note" id="timer-note"></div>
    </div>

    <div class="card accent">
      <div class="card-label">블록 높이</div>
      <div class="card-value orange">#${height?.toLocaleString() ?? "—"}</div>
      <div class="card-sub">제네시스로부터</div>
    </div>

    <div class="card">
      <div class="card-label">권장 수수료</div>
      <div class="card-value">${fees?.fastestFee ?? "—"} <span style="font-size:13px;color:#666">sat/vB</span></div>
      <div class="card-sub">보통 ${fees?.halfHourFee ?? "—"} · 느림 ${fees?.hourFee ?? "—"}</div>
    </div>

    <div class="card">
      <div class="card-label">네트워크 해시레이트</div>
      <div class="card-value" style="font-size:18px">${hashrate}</div>
      <div class="card-sub">채굴 파워</div>
    </div>

    <div class="card">
      <div class="card-label">난이도 조정</div>
      <div class="card-value" style="color:${diff?.difficultyChange > 0 ? '#4ade80' : '#f87171'}">${diffChange}</div>
      <div class="card-sub">${nextDiffBlocks} 블록 후</div>
    </div>

    <div class="card full">
      <div class="card-label">멤풀 상태</div>
      <div class="mempool-grid">
        <div>
          <div class="mempool-label">미확인 TX</div>
          <div class="mempool-value">${mempoolCount}</div>
        </div>
        <div>
          <div class="mempool-label">대기 용량</div>
          <div class="mempool-value">${mempoolSize}</div>
        </div>
        <div>
          <div class="mempool-label">총 수수료</div>
          <div class="mempool-value">${mempoolFee}</div>
        </div>
      </div>
    </div>

    <div class="card full">
      <div class="card-label">${halvingNum}차 반감기까지 — 블록 #${nextHalving.toLocaleString()}</div>
      <div class="halving-row">
        <div class="halving-value">${blocksLeft.toLocaleString()} 블록</div>
        <div class="halving-days">≈ ${daysLeft}일</div>
      </div>
      <div class="progress-track">
        <div class="halving-bar" style="width:${epochProgress}%"></div>
      </div>
      <div class="halving-sub">현재 에포크 ${epochProgress}% 완료 · 보상 ${currentReward} BTC/블록</div>
    </div>

    <div class="footer">
      <span>DATA: MEMPOOL.SPACE</span>
      <span>10분마다 블록이 생산된다</span>
    </div>
  `;

  startBlockTimer(lastBlockTime);
}

function renderError(msg) {
  document.getElementById("grid").innerHTML = `<div class="error-box">${msg}</div>`;
}

function startBlockTimer(lastBlockTime) {
  if (blockTimerInterval) clearInterval(blockTimerInterval);

  blockTimerInterval = setInterval(() => {
    const elapsed = Math.floor(Date.now() / 1000) - lastBlockTime;
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const pct = Math.min((elapsed / 600) * 100, 100);
    const over = elapsed > 600;

    const timerEl = document.getElementById("timer-val");
    const barEl = document.getElementById("progress-bar");
    const noteEl = document.getElementById("timer-note");

    if (timerEl) {
      timerEl.textContent = `${m}m ${String(s).padStart(2, "0")}s`;
      timerEl.className = "timer-value" + (over ? " over" : "");
    }
    if (barEl) {
      barEl.style.width = pct + "%";
      barEl.className = "progress-bar" + (over ? " over" : "");
    }
    if (noteEl) {
      noteEl.textContent = over
        ? `⚠ ${m - 10}m 지연 중`
        : `예상 잔여: ~${Math.max(0, 10 - m)}m`;
    }
  }, 1000);
}

// Service Worker 등록
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.warn);
}

// 온/오프라인 감지
const offlineBanner = document.createElement("div");
offlineBanner.style.cssText = `
  display:none; position:fixed; top:0; left:0; right:0;
  background:#1a0800; border-bottom:1px solid #f7931a44;
  color:#f7931a; font-size:10px; font-family:monospace;
  text-align:center; padding:6px; letter-spacing:0.1em; z-index:999;
`;
offlineBanner.textContent = "⚠ 오프라인 — 마지막 캐시 데이터 표시 중";
document.body.prepend(offlineBanner);

window.addEventListener("offline", () => offlineBanner.style.display = "block");
window.addEventListener("online", () => { offlineBanner.style.display = "none"; fetchAll(); });

// Init
fetchAll();
autoRefreshInterval = setInterval(fetchAll, 60000);
</script>
</body>
</html>
